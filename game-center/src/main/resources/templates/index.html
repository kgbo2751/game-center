<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Game Center</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 25px; background-color: #0f172a; color: #f8fafc; }
        h1 { margin-bottom: 5px; }
        .summary { color: #94a3b8; margin-bottom: 30px; }
        .section-title { margin-top: 30px; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .card h4 { margin: 0 0 12px 0; font-size: 15px; color: #e2e8f0; word-break: break-all; }
        .btn-2d { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-2d:hover { background: #0369a1; }
        .btn-3d { background: #8b5cf6; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-3d:hover { background: #7c3aed; }
    </style>
</head>
<body>
<h1>Game Center Portal</h1>
<div class="summary">Total Games: 2D (<span th:text="${games2d.size()}">0</span>) / 3D (<span th:text="${games3d.size()}">0</span>)</div>

<h2 class="section-title">3D Panda3D Games</h2>
<div class="grid">
    <div class="card" th:each="game : ${games3d}">
        <div>
            <h4 th:text="${#strings.replace(game, '.py', '')}"></h4>
            <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">
                Plays: <span th:text="${playCounts.containsKey(game) ? playCounts.get(game) : 0}">0</span>
            </div>
        </div>
        <button class="btn-3d" th:onclick="play('3d_panda3d', [[${game}]])">Launch 3D</button>
    </div>
</div>

<h2 class="section-title">2D Pygame Games</h2>
<div class="grid">
    <div class="card" th:each="game : ${games2d}">
        <div>
            <h4 th:text="${#strings.replace(game, '.py', '')}"></h4>
            <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">
                Plays: <span th:text="${playCounts.containsKey(game) ? playCounts.get(game) : 0}">0</span>
            </div>
        </div>
        <button class="btn-2d" th:onclick="play('2d_pygame', [[${game}]])">Launch 2D</button>
    </div>
</div>

<h2 class="section-title">Wallet & Inventory</h2>
<div style="display: flex; gap: 20px;">
    <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; flex: 2;">
        <h3 style="margin-top: 0; color: #38bdf8;">Balance: <span id="myBalance">0</span> G</h3>
        <h4 style="margin: 15px 0 10px 0; color: #e2e8f0;">My Items</h4>
        <div id="myInventory" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
    </div>
    <div id="rankingBoard" style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; flex: 1;">
        <!-- Ranking injected here -->
    </div>
</div>

<h2 class="section-title">Live Market</h2>
<div class="grid" id="marketGrid"></div>

<script>
    function loadMarket() {
        fetch('http://localhost:9000/api/market')
            .then(res => res.json())
            .then(data => {
                document.getElementById('myBalance').innerText = data.balance.toLocaleString();
                const marketGrid = document.getElementById('marketGrid');
                marketGrid.innerHTML = '';
                
                data.items.forEach(item => {
                    const isMyItem = item.sellerName === 'User';
                    const cardStyle = isMyItem ? 'background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8;' : '';
                    const btnColor = isMyItem ? '#475569' : '#10b981';
                    const btnHover = isMyItem ? '#475569' : '#059669';
                    
                    marketGrid.innerHTML += `
                        <div class="card" style="${cardStyle}">
                            <div>
                                <h4 style="color: #fbbf24;">${item.itemName}</h4>
                                <div style="font-size: 13px; color: #94a3b8; margin-bottom: 5px;">Seller: ${item.sellerName}</div>
                                <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">${item.price.toLocaleString()} G</div>
                            </div>
                            <button style="background:${btnColor}; color:white; border:none; padding:8px 12px; border-radius:5px; font-weight:bold; cursor:${isMyItem ? 'not-allowed' : 'pointer'};" 
                                    onmouseover="this.style.background='${btnHover}'" onmouseout="this.style.background='${btnColor}'"
                                    ${isMyItem ? 'disabled' : `onclick="buyItem(${item.id})"`}>
                                ${isMyItem ? 'Selling' : 'Buy Now'}
                            </button>
                        </div>
                    `;
                });
            });

        fetch('http://localhost:9000/api/market/inventory')
            .then(res => res.json())
            .then(items => {
                const inv = document.getElementById('myInventory');
                inv.innerHTML = '';
                if (items.length === 0) inv.innerHTML = '<span style="color:#64748b;">No items in inventory.</span>';
                items.forEach(item => {
                    inv.innerHTML += `
                        <div style="background:#334155; padding:6px 12px; border-radius:6px; color:#e2e8f0; font-size:14px;">
                            ${item.itemName} <span style="color:#94a3b8; font-size:12px;">(${item.price.toLocaleString()} G)</span>
                            <button onclick="sellItem(${item.id}, '${item.itemName}')" style="background:none; border:none; color:#38bdf8; cursor:pointer; font-weight:bold; margin-left:5px;">[Sell]</button>
                        </div>
                    `;
                });
            });

        fetch('http://localhost:9000/api/wallet/ranking')
            .then(res => res.json())
            .then(ranking => {
                const rankDiv = document.getElementById('rankingBoard');
                if(rankDiv) {
                    rankDiv.innerHTML = '<h3 style="margin-top:0; color:#fbbf24;">🏆 Gold Ranking Top 5</h3>';
                    ranking.forEach((user, idx) => {
                        const isMe = user.id === 'User';
                        rankDiv.innerHTML += `
                            <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #334155; ${isMe ? 'color:#38bdf8; font-weight:bold;' : 'color:#e2e8f0;'}">
                                <span>${idx + 1}. ${user.id}</span>
                                <span>${user.balance.toLocaleString()} G</span>
                            </div>
                        `;
                    });
                }
            });
    }

    function buyItem(itemId) {
        fetch('http://localhost:9000/api/market/buy/' + itemId, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'SUCCESS') {
                    loadMarket();
                } else {
                    alert("Buy failed: " + data.message);
                }
            });
    }

    function sellItem(itemId, itemName) {
        const price = prompt("How much do you want to sell " + itemName + " for?", "");
        if (!price) return;
        
        fetch('http://localhost:9000/api/market/sell/' + itemId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ price: price })
        })
        .then(res => res.json())
        .then(data => {
            loadMarket();
        });
    }

    function play(category, scriptName) {
        const formData = new URLSearchParams();
        formData.append('category', category);
        formData.append('script', scriptName);

        fetch('/api/games/launch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        })
        .then(res => res.text())
        .then(result => {
            if (result !== 'SUCCESS') {
                alert(result);
            }
        })
        .catch(err => alert(err));
    }

    loadMarket();
    setInterval(loadMarket, 3000);
</script>
</body>
</html>
