<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python Game Center</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a4a);
            color: #ffffff;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 1.5em;
            border-bottom: 2px solid #444466;
            padding-bottom: 10px;
            margin-top: 40px;
            color: #ffaa00;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }
        .card h4 {
            margin: 0 0 15px 0;
            font-size: 1.2em;
            word-break: break-all;
        }
        .btn-launch {
            background: #00ffcc;
            color: #1e1e2f;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-launch:hover {
            background: #00ccaa;
        }
        .btn-3d {
            background: #ffaa00;
        }
        .btn-3d:hover {
            background: #cc8800;
        }
    </style>
</head>
<body>
    <h1>🕹️ Game Center</h1>

    <h2 class="section-title">3D Panda3D Games</h2>
    <div class="grid" id="grid3d">
    </div>

    <h2 class="section-title">2D Pygame Games</h2>
    <div class="grid" id="grid2d">
    </div>

    <h2 class="section-title">💰 내 지갑 & 인벤토리</h2>
    <div style="display: flex; gap: 20px;">
        <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; flex: 2;">
            <h3>보유 금액: <span id="myBalance" style="color:#00ffcc;">0</span> Gold</h3>
            <h4>내 아이템 목록</h4>
            <div id="myInventory" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
        </div>
        <div id="rankingBoard" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; flex: 1;">
            <!-- Ranking injected here -->
        </div>
    </div>

    <h2 class="section-title">🛒 실시간 경매장</h2>
    <div class="grid" id="marketGrid">
    </div>

    <script>
        fetch('/api/games')
            .then(res => res.json())
            .then(data => {
                const grid2d = document.getElementById('grid2d');
                const grid3d = document.getElementById('grid3d');

                data.games3d.forEach(game => {
                    const name = game.replace('.py', '');
                    const plays = data.playCounts[game] || 0;
                    grid3d.innerHTML += `
                        <div class="card">
                            <h4>${name}</h4>
                            <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">Plays: ${plays}</div>
                            <button class="btn-launch btn-3d" onclick="playGame('3d_panda3d', '${game}')">Launch 3D</button>
                        </div>
                    `;
                });

                data.games2d.forEach(game => {
                    const name = game.replace('.py', '');
                    const plays = data.playCounts[game] || 0;
                    grid2d.innerHTML += `
                        <div class="card">
                            <h4>${name}</h4>
                            <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">Plays: ${plays}</div>
                            <button class="btn-launch" onclick="playGame('2d_pygame', '${game}')">Launch 2D</button>
                        </div>
                    `;
                });
            });

        function loadMarket() {
            fetch('http://localhost:9000/api/market')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('myBalance').innerText = data.balance.toLocaleString();
                    const marketGrid = document.getElementById('marketGrid');
                    marketGrid.innerHTML = '';
                    
                    data.items.forEach(item => {
                        const isMyItem = item.sellerName === 'User';
                        const cardStyle = isMyItem ? 'background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc;' : '';
                        marketGrid.innerHTML += `
                            <div class="card" style="${cardStyle}">
                                <h4 style="color: #ffaa00;">${item.itemName}</h4>
                                <div style="font-size: 13px; color: #94a3b8; margin-bottom: 5px;">판매자: ${item.sellerName}</div>
                                <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">${item.price.toLocaleString()} G</div>
                                <button class="btn-launch" style="background:${isMyItem ? '#00ffcc' : '#ff4444'}; color:${isMyItem ? '#1e1e2f' : 'white'};" ${isMyItem ? 'disabled' : `onclick="buyItem(${item.id})"`}>
                                    ${isMyItem ? '판매중' : '구매하기'}
                                </button>
                            </div>
                        `;
                    });
                });

            fetch('http://localhost:9000/api/market/inventory')
                .then(res => res.json())
                .then(items => {
                    const inv = document.getElementById('myInventory');
                    inv.innerHTML = '';
                    if (items.length === 0) inv.innerHTML = '<span style="color:#666;">가진 아이템이 없습니다.</span>';
                    items.forEach(item => {
                        inv.innerHTML += `
                            <div style="background:#333; padding:5px 10px; border-radius:5px;">
                                ${item.itemName} <span style="color:#94a3b8; font-size:12px;">(${item.price.toLocaleString()} G)</span>
                                <button onclick="sellItem(${item.id}, '${item.itemName}')" style="background:none; border:none; color:#00ffcc; cursor:pointer;">[팔기]</button>
                            </div>
                        `;
                    });
                });

            fetch('http://localhost:9000/api/wallet/ranking')
                .then(res => res.json())
                .then(ranking => {
                    const rankDiv = document.getElementById('rankingBoard');
                    if(rankDiv) {
                        rankDiv.innerHTML = '<h3>🏆 실시간 골드 순위 탑5</h3>';
                        ranking.forEach((user, idx) => {
                            const isMe = user.id === 'User';
                            rankDiv.innerHTML += `
                                <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #333; ${isMe ? 'color:#00ffcc; font-weight:bold;' : ''}">
                                    <span>${idx + 1}. ${user.id}</span>
                                    <span>${user.balance.toLocaleString()} G</span>
                                </div>
                            `;
                        });
                    }
                });
        }

        function buyItem(itemId) {
            fetch('http://localhost:9000/api/market/buy/' + itemId, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'SUCCESS') {
                        loadMarket();
                    } else {
                        alert("구매 실패: " + data.message);
                    }
                });
        }

        function sellItem(itemId, itemName) {
            const price = prompt(itemName + "을(를) 얼마에 올리시겠습니까?", "");
            if (!price) return;
            
            fetch('http://localhost:9000/api/market/sell/' + itemId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ price: price })
            })
            .then(res => res.json())
            .then(data => {
                loadMarket();
            });
        }

        function playGame(category, scriptName) {
            fetch('/api/games/launch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category: category, script: scriptName })
            });
        }

        loadMarket();
        setInterval(loadMarket, 3000); // 3초마다 화면 자동 새로고침 (실시간 효과)
    </script>
</body>
</html>
