server:
  port: 9000
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: market-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/market/**, /api/games/**, /api/stats/**
        - id: wallet-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/wallet/**
  main:
    web-application-type: reactive
